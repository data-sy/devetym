# DevEtym 웹 — Cloudflare Worker 배포 설정 (W0a · W1b 확장)
#
# ⚠️ 프록시(`~/devetym-proxy`)와 **다른 Worker**다. 표면을 분리해 두는 이유는
#    ADR-0010(웹 남용 방지)의 「표면 분리 캡」과 같다 — 웹이 무엇을 태우든
#    앱 요청 경로가 영향받지 않아야 한다.
#
# ⚠️ **최상위 키는 전부 첫 섹션 헤더(`[assets]`) 앞에 둔다.** TOML은 섹션 헤더 뒤의 키를
#    그 섹션 소유로 읽는다 — W1b에서 `[assets]`를 위로 옮겼다가 뒤따르던 `workers_dev = false`가
#    `assets.workers_dev`로 삼켜졌다(wrangler가 "Unexpected fields in assets" 경고로 잡아 줬다).
#    그대로 배포했으면 미리보기 서브도메인이 되살아나 devetym.com과 중복 콘텐츠로 경쟁했다.

name = "devetym-web"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

# ⚠️ 실 도메인이 붙은 뒤로는 **끈다**. 켜 두면 workers.dev가 같은 내용을
#    색인 허용 상태로 서빙해 devetym.com과 중복 콘텐츠로 경쟁한다
#    (빌드가 SITE_URL=devetym.com이라 noindex가 안 붙는다 — 2026-08-25 실측).
workers_dev = false

# ⚠️ SITE_URL을 여기 두지 않는다. 페이지가 prerender라 도메인은 **빌드 시점**에
#    구워진다 — 런타임 [vars]에 넣으면 정적 HTML의 canonical/OG와 어긋난 값이
#    두 벌 생긴다. 정본은 src/config/site.ts 한 곳이고, 배포 환경이 덮을 때는
#    빌드 전에 `SITE_URL=... npm run build`로 준다.

[assets]
directory = "./dist"
binding = "ASSETS"
# 슬래시 없는 쪽을 정본으로 고정한다 — Astro `trailingSlash: "never"`와 짝을 맞춘다.
# 기본값(`auto-trailing-slash`)이면 `/term/mutex`가 `/term/mutex/`로 307이 되어
# canonical·사이트맵이 가리키는 URL과 실 응답이 갈린다.
html_handling = "drop-trailing-slash"

# 커스텀 도메인 (W0b · 2026-08-25). wrangler가 DNS 레코드를 자동 생성한다.
# ⚠️ **www 301은 Astro 미들웨어로 못 한다.** 어댑터가 생성하는 `_routes.json`이
#    prerender된 경로(`/` 등)를 Worker 호출에서 **제외**하기 때문에 미들웨어가 아예 안 탄다
#    (`assets.run_worker_first`로도 안 뒤집힌다 — 2026-08-25 실측).
#    → 301은 **Cloudflare Redirect Rule**(존 레벨·Worker 미경유)로 건다. ROADMAP 백로그 참조.
#    그때까지의 완화 = www가 서빙하는 HTML의 canonical이 apex를 가리킨다(BaseLayout).
[[routes]]
pattern = "devetym.com"
custom_domain = true

[[routes]]
pattern = "www.devetym.com"
custom_domain = true

# ── 프록시 service binding (W1b) ──────────────────────────────────────────────
# `devetym.com/api/term`이 프록시를 **런타임 내부 호출**로 부른다. 인터넷을 다시 타지 않으므로
# 요청 헤더가 그대로 건너가고, 특히 `CF-Connecting-IP`가 보존된다 — 이게 안 보존되면
# 프록시의 IP 15건/일 층이 **전 웹 사용자 공용 버킷 하나**로 붕괴한다(15건 뒤 전원 429).
# **배포 후 실측 항목이다**(핸드오프 §5 참조).
#
# ⚠️ 이 바인딩이 없으면 /api/term은 503을 낸다. **workers.dev로 폴백하지 않는다** —
#    폴백하면 서드파티 쿠키가 되어 Safari에서 3건 층이 조용히 사라진다(핸드오프 §5-12).
[[services]]
binding = "PROXY"
service = "devetym-proxy"

# ── D1 조회 전용 바인딩 (W1b · ADR-0013 Decision 2) ────────────────────────────
# `/term/<key>`가 정적 650장에 없을 때 **조회만** 한다. 생성은 여기서 절대 일어나지 않는다 —
# GET 경로에 생성을 두면 크롤러 한 번이 웹 전역 캡을 태운다(T6, ADR-0013 기각안 3).
#
# ⚠️ 프록시(`devetym-proxy`)와 **같은 프로덕션 DB**다. 웹 워커는 여기에 쓰지 않는다 —
#    쓰기(캐시 적재·충돌 규칙)는 프록시 한 곳이 정본이다.
[[d1_databases]]
binding = "CACHE_DB"
database_name = "devetym-cache"
database_id = "a42d4408-ff64-40d4-8a6a-c71672fd71c2"
